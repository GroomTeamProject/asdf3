name: CI/CD - user-service (PR to manifest/service)

on:
  push:
    branches:
      - test/pr-run          # 최종에는 develop 브랜치로 변경
    paths:
      - "msa/user-service/**"
      - ".github/workflows/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-user-service-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  SERVICE_NAME: user-service
  ECR_REPO: team02-user-service
  MANIFEST_FILE: infra/k8s/user-service.yaml

jobs:
  build-test-push-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build & Test user-service
        run: |
          cd msa/${{ env.SERVICE_NAME }}
          ../gradlew :${{ env.SERVICE_NAME }}:build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Image to ECR
        run: |
          IMAGE_TAG=${{ github.sha }}
          ECR_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}

          echo "Building image: $ECR_URI:$IMAGE_TAG"
          docker build -t $ECR_URI:$IMAGE_TAG ./msa/${{ env.SERVICE_NAME }}
          docker tag $ECR_URI:$IMAGE_TAG $ECR_URI:latest

          echo "Pushing images to ECR..."
          docker push $ECR_URI:$IMAGE_TAG
          docker push $ECR_URI:latest

      - name: Create/Update PR branch and bump manifest image
        run: |
          PR_BRANCH="bot/${{ env.SERVICE_NAME }}/${{ github.sha }}"
          git checkout -b "$PR_BRANCH"

          NEW_IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:${{ github.sha }}"
          sed -i "s|^\s*image:.*|        image: $NEW_IMAGE|g" ${{ env.MANIFEST_FILE }}

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ${{ env.MANIFEST_FILE }}
          git commit -m "chore(${{
            env.SERVICE_NAME
          }}): bump image to ${{ github.sha }}" || echo "No changes to commit"

          git push --set-upstream origin "$PR_BRANCH" --force-with-lease

      - name: Create PR into manifest/service
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore(${{
            env.SERVICE_NAME
          }}): deploy ${{ github.sha }}"
          body: |
            Auto PR generated by CI for **${{ env.SERVICE_NAME }}**.

            - Image: `${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:${{ github.sha }}`
            - Manifest: `${{ env.MANIFEST_FILE }}`
          commit-message: "chore(${{
            env.SERVICE_NAME
          }}): bump image to ${{ github.sha }}"
          branch: "bot/${{ env.SERVICE_NAME }}/${{ github.sha }}"
          base: "manifest/service"
          labels: |
            auto-merge
            user-service
